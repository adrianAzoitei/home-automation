- alias: Stale sensor alarm room 1
  id: "167888000007"
  description: "Trigger an alarm when this temperature sensor is stale"
  trigger:
    # Trigger every minute on the minute (00:00, 00:01, etc.)
    - platform: time_pattern
      minutes: "/10"
  condition:
    # Only proceed if the last_updated time is more than 600 seconds ago
    - condition: template
      value_template: >-
        {{ (as_timestamp(now()) - as_timestamp(states.sensor.temperature_sensor_room_1_temperature.last_updated)) > 600.0 }}
  actions:
    - service: notify.mobile_app_iphone_mk4r7h4nqq
      metadata: {}
      data:
        title: Stale temperature sensor
        message: Room 1
    - service: notify.persistent_notification
      metadata: {}
      data:
        title: Stale temperature sensor
        message: "Room 1 last updated {{ (as_timestamp(now()) - as_timestamp(states.sensor.temperature_sensor_room_1_temperature.last_updated)) | int }} seconds ago"
  mode: single
