- alias: Set Thermostat via Slider
  id: "167888000001"
  description: Calls REST command whenever the input_number changes
  trigger:
    - platform: state
      entity_id: input_number.central_heating_setpoint
  condition: []
  action:
    - service: rest_command.thermostat_set_point
      data:
        set_point: "{{ states('input_number.central_heating_setpoint') }}"
  mode: single
- alias: Set Temperature via Slider (for debugging)
  id: "167888000002"
  description: Calls REST command whenever the input_number changes
  trigger:
    - platform: state
      entity_id: input_number.temperature
  condition: []
  action:
    - service: rest_command.thermostat_room_temperature
      data:
        temperature: "{{ states('input_number.temperature') }}"
  mode: single
- alias: "Set CH setpoint based on leader room"
  id: "167888000003"
  mode: single
  trigger:
    - platform: state
      entity_id:
        - climate.room_1_radiator_valve
        - climate.room_2_radiator_valve
        - climate.room_3_radiator_valve
        # add more climate entities here
  conditions: []
  action:
    - service: script.set_leader_temperature
    - service: script.set_leader_target_temperature
- alias: Sync Room 1 valve with temperature sensor
  id: "167888000004"
  description: Sync SNZB02D temp to TRVZB external input
  triggers:
    - entity_id: sensor.temperature_sensor_room_1_temperature
      trigger: state
  conditions: []
  actions:
    - action: mqtt.publish
      metadata: {}
      data:
        evaluate_payload: false
        qos: "1"
        retain: false
        topic: zigbee2mqtt/Room 1 Radiator Valve/set/external_temperature_input
        payload: "{{ trigger.to_state.state | float }}"
  mode: single
